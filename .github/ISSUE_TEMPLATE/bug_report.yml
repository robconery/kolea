name: 🐛 Bug report
description: Something behaves differently than docs/SPEC.md says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a **security** issue, please stop and use
        the Security tab → *Report a vulnerability* instead — see `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what you got instead of what you expected.
      placeholder: |
        1. Seeded demo data
        2. Opened a subscriber's preference center with ?scope=sequence:2
        3. Clicked "Stop just this series"
        4. Expected: still `active`. Got: `unsubscribed`.
    validations:
      required: true
  - type: input
    id: spec-clause
    attributes:
      label: Relevant SPEC clause
      description: If you can, the numbered requirement in `docs/SPEC.md` this contradicts.
      placeholder: "2.4"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Consent / unsubscribe
        - Broadcasts
        - Sequences
        - Editor (TipTap)
        - Transactional API
        - MCP server
        - Tracking / webhooks
        - Stripe attribution
        - Admin UI
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Email provider
      options:
        - console (local Outbox)
        - resend
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `bun --version` and `wrangler --version`, plus local or deployed.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Console output, a failing response body, or a row from `mcp_calls`. **Redact any API keys.**
      render: shell
