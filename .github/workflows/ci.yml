name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Two passes: the Worker (workers-types) and the browser bundle (DOM lib).
      # They must not share a tsconfig — workerd's Response/Headers shadow the
      # DOM ones and silently resolve the wrong overloads.
      - name: Typecheck
        run: bun run typecheck

      - name: Build the editor bundle
        run: bun run build:client
